services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lonio
      POSTGRES_PASSWORD: lonio
      POSTGRES_DB: lonio
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lonio -d lonio"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
